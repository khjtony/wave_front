[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wave-front"
version = "0.1.0"
description = "Reachability and strategy analysis of finite concurrent games between strategic actors."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
bmc = ["z3-solver"]
dev = ["pytest", "hypothesis", "ruff"]

[project.scripts]
wf = "wavefront.cli:main"

[tool.setuptools.packages.find]
include = ["wavefront*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests such as the exploration performance smoke test",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
