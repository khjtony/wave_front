[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wave-front"
version = "0.1.0"
description = "Reachability and strategy analysis of finite concurrent games between strategic actors."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
bmc = ["z3-solver"]
data = ["pyreadr", "pandas"]
extract = ["anthropic"]
# The compiled BDD core: pip install -e '.[fast]' && python -m wavefront.symbolic._core.build
fast = ["cffi>=1.15", "setuptools"]
dev = ["pytest", "hypothesis", "ruff", "jsonschema", "playwright"]

[project.scripts]
wf = "wavefront.cli:main"

[tool.setuptools.packages.find]
include = ["wavefront*"]

[tool.setuptools.package-data]
"wavefront.viz" = ["template/*.html", "template/*.css", "template/*.js"]
"wavefront.symbolic._core" = ["*.c", "*.h"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: long-running tests such as the exploration performance smoke test",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
# Python snippets in the Markdown docs are illustrations, not code to reformat.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
